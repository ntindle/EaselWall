name: Release

on:
  push:
    tags:
      - 'v*'

# Only one release may publish mutable channels at a time. A static group is
# intentional: version-specific groups would still allow an older tag to race
# a newer tag while updating Homebrew and the Sparkle appcast.
concurrency:
  group: easelwall-release-publishing
  cancel-in-progress: false

env:
  APP_NAME: EaselWall
  SCHEME: EaselWall

jobs:
  build-sign-release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve retry-safe release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SEMVER_RE='^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'
          if [[ ! "$VERSION" =~ $SEMVER_RE ]]; then
            echo "::error::Release tags must use canonical vMAJOR.MINOR.PATCH components from 0 to 999"
            exit 1
          fi
          . scripts/release_metadata_guards.sh
          if ! CANDIDATE_PROJECT_VERSION=$(single_project_version project.yml); then
            echo "::error::Tagged project.yml must contain exactly one canonical MARKETING_VERSION"
            exit 1
          fi
          if [[ "$CANDIDATE_PROJECT_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag v$VERSION contains project version $CANDIDATE_PROJECT_VERSION; refusing a mismatched build"
            exit 1
          fi

          # Compact, globally ordered identity: seconds since 2025, direct
          # channel 1, and Actions attempt. This stays within Apple's observed
          # 18-character CFBundleVersion ceiling.
          CURRENT_EPOCH=$(date -u +%s)
          BUILD_RUN=$((CURRENT_EPOCH - 1735689600))
          if (( BUILD_RUN <= 837975 )); then
            echo "::error::Build run $BUILD_RUN must exceed shipped build 837975"
            exit 1
          fi
          BUILD_CHANNEL=1
          BUILD_ATTEMPT="${GITHUB_RUN_ATTEMPT:-1}"
          if [[ ! "$BUILD_CHANNEL" =~ ^(0|[1-9][0-9]*)$ || "$BUILD_CHANNEL" != 1 ]]; then
            echo "::error::Release build channel must be numeric channel 1"
            exit 1
          fi
          if [[ ! "$BUILD_ATTEMPT" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::GITHUB_RUN_ATTEMPT must be canonical numeric"
            exit 1
          fi
          BUILD_NUM="$BUILD_RUN.$BUILD_CHANNEL.$BUILD_ATTEMPT"
          BUILD_RE='^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){0,2}$'
          if [[ ! "$BUILD_NUM" =~ $BUILD_RE || ${#BUILD_NUM} -gt 18 ]]; then
            echo "::error::CFBundleVersion must be 1-3 numeric components and at most 18 characters"
            exit 1
          fi
          {
            echo "VERSION=$VERSION"
            echo "BUILD_NUM=$BUILD_NUM"
          } >> "$GITHUB_ENV"
          echo "Version: $VERSION, build $BUILD_NUM"

      - name: Bind the build to its remote release tag
        run: |
          TAG="v$VERSION"
          git fetch --prune --no-tags origin \
            '+refs/tags/*:refs/remotes/origin-tags/*'
          REMOTE_TAG_REF="refs/remotes/origin-tags/$TAG"
          if ! REMOTE_TAG_COMMIT=$(git rev-parse --verify "$REMOTE_TAG_REF^{commit}"); then
            echo "::error::Release tag $TAG does not exist on origin"
            exit 1
          fi
          if [[ "$REMOTE_TAG_COMMIT" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Origin tag $TAG does not resolve to the checked-out commit"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          chmod 600 "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Build Release
        run: |
          xcodebuild -project EaselWall.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/app-signing.keychain-db" \
            build

      - name: Re-sign Sparkle and embedded binaries with Developer ID
        run: |
          # Sparkle ships its XPC services pre-signed (ad-hoc) and they
          # aren't replaced during xcodebuild build. Re-sign every embedded
          # binary inside-out with Developer ID + secure timestamp + hardened
          # runtime so notarization accepts the bundle.
          APP_PATH="build/DerivedData/Build/Products/Release/$APP_NAME.app"
          IDENTITY="Developer ID Application"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          sign() {
            codesign --force --options runtime --timestamp \
              --sign "$IDENTITY" --keychain "$KEYCHAIN" "$@"
          }
          # XPC services
          for xpc in "$APP_PATH"/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/*.xpc; do
            sign "$xpc"
          done
          # Helper binaries inside Sparkle
          for helper in Autoupdate "Updater.app"; do
            target="$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/$helper"
            [ -e "$target" ] && sign "$target"
          done
          # Sparkle framework itself
          sign "$APP_PATH/Contents/Frameworks/Sparkle.framework"
          # Widget extension
          if [ -d "$APP_PATH/Contents/PlugIns/EaselWallControlWidget.appex" ]; then
            sign --entitlements EaselWallControlWidget.entitlements \
              "$APP_PATH/Contents/PlugIns/EaselWallControlWidget.appex"
          fi
          # Main app, last
          sign --entitlements EaselWall.entitlements "$APP_PATH"

      - name: Verify code signature
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=2 "$APP_PATH" 2>&1 | grep -E "Authority|TeamIdentifier|Timestamp"
          echo "Code signature verified"

      - name: Create DMG
        run: |
          mkdir -p build/release
          cp -R "build/DerivedData/Build/Products/Release/$APP_NAME.app" build/release/
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder build/release \
            -ov -format UDZO \
            "build/$APP_NAME-$VERSION.dmg"
          codesign --sign "Developer ID Application" "build/$APP_NAME-$VERSION.dmg"

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "build/$APP_NAME-$VERSION.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

      - name: Staple notarization ticket
        run: xcrun stapler staple "build/$APP_NAME-$VERSION.dmg"

      - name: Sign DMG for Sparkle updates
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_KEY" ]; then
            echo "SPARKLE_ED_PRIVATE_KEY is not configured" >&2
            exit 1
          fi

          SPARKLE_BIN="build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          if [ ! -x "$SPARKLE_BIN" ]; then
            echo "sign_update not found, resolving packages first..."
            xcodebuild -resolvePackageDependencies -project EaselWall.xcodeproj 2>/dev/null
            SPARKLE_BIN=$(find ~/Library/Developer/Xcode/DerivedData \
              -type f -name "sign_update" -path "*/Sparkle/bin/*" -print -quit)
          fi
          if [ ! -x "$SPARKLE_BIN" ]; then
            echo "Unable to locate Sparkle's sign_update tool" >&2
            exit 1
          fi

          # -p emits only the base64 EdDSA signature. Parsing the default
          # enclosure attributes with a greedy expression can capture the
          # trailing sparkle:length value instead.
          ED_SIGNATURE=$(printf '%s\n' "$SPARKLE_KEY" | \
            "$SPARKLE_BIN" --ed-key-file - -p "build/$APP_NAME-$VERSION.dmg")
          if ! [[ "$ED_SIGNATURE" =~ ^[A-Za-z0-9+/]{86}==$ ]]; then
            echo "sign_update returned an invalid EdDSA signature" >&2
            exit 1
          fi
          echo "ED_SIGNATURE=$ED_SIGNATURE" >> "$GITHUB_ENV"
          echo "Generated Sparkle EdDSA signature"

      - name: Compute SHA256
        run: |
          SHA256=$(shasum -a 256 "build/$APP_NAME-$VERSION.dmg" | awk '{print $1}')
          DMG_SIZE=$(stat -f%z "build/$APP_NAME-$VERSION.dmg")
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "DMG_SIZE=$DMG_SIZE" >> "$GITHUB_ENV"
          echo "SHA256: $SHA256, Size: $DMG_SIZE"

      # Re-check after the long build/notarization phase. If a newer tag was
      # pushed while this run was building, this run must not publish an older
      # GitHub release, Homebrew cask, or appcast entry afterward.
      - name: Verify tag is latest release before publishing
        run: |
          git fetch --prune --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/tags/*:refs/remotes/origin-tags/*'
          TAG="v$VERSION"
          REMOTE_TAG_REF="refs/remotes/origin-tags/$TAG"
          if ! REMOTE_TAG_COMMIT=$(git rev-parse --verify "$REMOTE_TAG_REF^{commit}"); then
            echo "::error::Release tag $TAG no longer exists on origin"
            exit 1
          fi
          CHECKED_OUT_COMMIT=$(git rev-parse HEAD)
          if [[ "$REMOTE_TAG_COMMIT" != "$CHECKED_OUT_COMMIT" ]]; then
            echo "::error::Origin tag $TAG does not resolve to the checked-out commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor \
            "$CHECKED_OUT_COMMIT" refs/remotes/origin/main; then
            echo "::error::Release tag $TAG is not contained in origin/main"
            exit 1
          fi

          LATEST_TAG=""
          SEMVER_TAG_RE='^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'
          while IFS= read -r REMOTE_REF; do
            CANDIDATE="${REMOTE_REF#refs/remotes/origin-tags/}"
            if [[ "$CANDIDATE" =~ $SEMVER_TAG_RE ]]; then
              LATEST_TAG="$CANDIDATE"
              break
            fi
          done < <(git for-each-ref --sort=-version:refname \
            --format='%(refname)' refs/remotes/origin-tags/)

          if [[ -z "$LATEST_TAG" ]]; then
            echo "::error::No semantic release tag exists"
            exit 1
          fi
          if [[ "$LATEST_TAG" != "$TAG" ]]; then
            echo "::error::Refusing to publish v$VERSION because $LATEST_TAG is newer"
            exit 1
          fi

          # BEGIN RELEASE TAG DATE HELPERS
          release_tag_date() {
            local ref="$1" format="$2" value
            value=$(git for-each-ref --format="%(creatordate:$format)" "$ref")
            if [[ -z "$value" ]]; then return 1; fi
            printf '%s\n' "$value"
          }
          # END RELEASE TAG DATE HELPERS
          if ! RELEASE_PUB_DATE=$(release_tag_date "$REMOTE_TAG_REF" rfc2822); then
            echo "::error::Unable to resolve creator date for release tag $TAG"
            exit 1
          fi
          if ! RELEASE_DATE=$(release_tag_date "$REMOTE_TAG_REF" short); then
            echo "::error::Unable to resolve short creator date for release tag $TAG"
            exit 1
          fi
          if [[ ! "$RELEASE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Release tag $TAG has an invalid creator date"
            exit 1
          fi
          {
            echo "RELEASE_PUB_DATE=$RELEASE_PUB_DATE"
            echo "RELEASE_DATE=$RELEASE_DATE"
          } >> "$GITHUB_ENV"
          echo "v$VERSION is the latest release tag"

      # Preflight every mutable channel before publishing public bytes. The
      # same parsers are sourced again immediately before each later mutation.
      - name: Check out main for release metadata
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: appcast-repo

      - name: Clone Homebrew tap for preflight
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${TAP_TOKEN}@github.com/ntindle/homebrew-easelwall.git" \
            "$RUNNER_TEMP/homebrew-tap"

      - name: Preflight mutable release channels
        working-directory: appcast-repo
        run: |
          git pull --no-rebase origin main
          . scripts/release_metadata_guards.sh

          TAP_CASK="$RUNNER_TEMP/homebrew-tap/Casks/easelwall.rb"
          REPOSITORY_CASK="Casks/easelwall.rb"
          if ! TAP_VERSION=$(single_cask_version "$TAP_CASK"); then
            echo "::error::Homebrew cask must contain exactly one canonical version declaration"
            exit 1
          fi
          if ! TAP_SHA256=$(single_cask_sha256 "$TAP_CASK"); then
            echo "::error::Homebrew cask must contain exactly one canonical sha256 declaration"
            exit 1
          fi
          if ! REPOSITORY_CASK_VERSION=$(single_cask_version "$REPOSITORY_CASK"); then
            echo "::error::Repository cask must contain exactly one canonical version declaration"
            exit 1
          fi
          if ! REPOSITORY_CASK_SHA256=$(single_cask_sha256 "$REPOSITORY_CASK"); then
            echo "::error::Repository cask must contain exactly one canonical sha256 declaration"
            exit 1
          fi
          if ! APPCAST_VERSION=$(single_appcast_value version website/appcast.xml); then
            echo "::error::Appcast must contain exactly one valid short version"
            exit 1
          fi
          if ! APPCAST_BUILD=$(single_appcast_value build website/appcast.xml); then
            echo "::error::Appcast must contain exactly one numeric sparkle build"
            exit 1
          fi
          if ! PROJECT_VERSION=$(single_project_version project.yml); then
            echo "::error::project.yml must contain exactly one canonical MARKETING_VERSION"
            exit 1
          fi
          if ! STRUCTURED_VERSION=$(single_structured_version website/index.html); then
            echo "::error::Website structured data must contain exactly one canonical softwareVersion"
            exit 1
          fi
          if ! HOMEPAGE_LASTMOD=$(single_homepage_lastmod website/sitemap.xml); then
            echo "::error::Sitemap must contain exactly one canonical homepage lastmod"
            exit 1
          fi

          if [[ "$PROJECT_VERSION" != "$VERSION" ]]; then
            echo "::error::Main project version $PROJECT_VERSION does not match release candidate $VERSION"
            exit 1
          fi
          if ! PUBLISHED_VERSION=$(single_current_published_version \
            "$VERSION" "$TAP_VERSION" "$REPOSITORY_CASK_VERSION" \
            "$APPCAST_VERSION" "$STRUCTURED_VERSION"); then
            echo "::error::Homebrew, repository cask, appcast, and website versions disagree or exceed candidate $VERSION"
            exit 1
          fi
          if [[ "$TAP_SHA256" != "$REPOSITORY_CASK_SHA256" ]]; then
            echo "::error::Repository cask checksum does not match the public Homebrew tap"
            exit 1
          fi
          if [[ "$TAP_VERSION" == "$VERSION" && "$TAP_SHA256" != "$SHA256" ]]; then
            echo "::error::Version $VERSION is already published with a different checksum; refusing public asset replacement"
            exit 1
          fi
          if build_greater_or_equal "$APPCAST_BUILD" "$BUILD_NUM"; then
            echo "::error::Appcast build $APPCAST_BUILD is newer than or equal to candidate $BUILD_NUM"
            exit 1
          fi
          echo "Preflight passed: candidate $PROJECT_VERSION; current channels publish $PUBLISHED_VERSION (build $APPCAST_BUILD; homepage $HOMEPAGE_LASTMOD)"

      - name: Refuse unsafe release asset overwrite
        uses: actions/github-script@v7
        env:
          RELEASE_ASSET_NAME: ${{ env.APP_NAME }}-${{ env.VERSION }}.dmg
        with:
          script: |
            let release
            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: `v${process.env.VERSION}`,
              })
              release = response.data
            } catch (error) {
              if (error.status === 404) {
                core.info('No existing GitHub release; first publication may proceed')
                return
              }
              throw error
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              per_page: 100,
            })
            const existing = assets.find(
              (asset) => asset.name === process.env.RELEASE_ASSET_NAME,
            )
            if (existing) {
              throw new Error(
                `Public asset ${existing.name} already exists for v${process.env.VERSION}. ` +
                'This workflow will not replace bytes while Homebrew or Sparkle may still ' +
                'reference them. Recover the remaining metadata from the existing asset, ' +
                'or publish a new version tag.',
              )
            }
            core.info('Existing release has no same-name asset; first asset publication may proceed')

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.APP_NAME }}-${{ env.VERSION }}.dmg
          overwrite_files: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install

            **Direct download:** Download the DMG above.

            **Homebrew:**
            ```
            brew install ntindle/easelwall/easelwall
            ```

            **SHA256:** `${{ env.SHA256 }}`

      - name: Update Homebrew tap
        run: |
          METADATA_ROOT="$GITHUB_WORKSPACE/appcast-repo"
          git -C "$METADATA_ROOT" pull --no-rebase origin main
          . "$METADATA_ROOT/scripts/release_metadata_guards.sh"
          cd "$RUNNER_TEMP/homebrew-tap"
          git pull --no-rebase origin main
          if ! CURRENT_VERSION=$(single_cask_version Casks/easelwall.rb); then
            echo "::error::Homebrew cask must contain exactly one canonical version declaration"
            exit 1
          fi
          if ! CURRENT_SHA256=$(single_cask_sha256 Casks/easelwall.rb); then
            echo "::error::Homebrew cask must contain exactly one canonical sha256 declaration"
            exit 1
          fi
          if ! CURRENT_REPOSITORY_CASK_VERSION=$(single_cask_version "$METADATA_ROOT/Casks/easelwall.rb"); then
            echo "::error::Repository cask must contain exactly one canonical version declaration"
            exit 1
          fi
          if ! CURRENT_REPOSITORY_CASK_SHA256=$(single_cask_sha256 "$METADATA_ROOT/Casks/easelwall.rb"); then
            echo "::error::Repository cask must contain exactly one canonical sha256 declaration"
            exit 1
          fi
          if ! CURRENT_APPCAST_VERSION=$(single_appcast_value version "$METADATA_ROOT/website/appcast.xml"); then
            echo "::error::Appcast must contain exactly one valid short version"
            exit 1
          fi
          if ! CURRENT_APPCAST_BUILD=$(single_appcast_value build "$METADATA_ROOT/website/appcast.xml"); then
            echo "::error::Appcast must contain exactly one numeric sparkle build"
            exit 1
          fi
          if ! CURRENT_PROJECT_VERSION=$(single_project_version "$METADATA_ROOT/project.yml"); then
            echo "::error::project.yml must contain exactly one canonical MARKETING_VERSION"
            exit 1
          fi
          if ! CURRENT_STRUCTURED_VERSION=$(single_structured_version "$METADATA_ROOT/website/index.html"); then
            echo "::error::Website structured data must contain exactly one canonical softwareVersion"
            exit 1
          fi
          if ! single_homepage_lastmod "$METADATA_ROOT/website/sitemap.xml" >/dev/null; then
            echo "::error::Sitemap must contain exactly one canonical homepage lastmod"
            exit 1
          fi
          echo "Current Homebrew cask: $CURRENT_VERSION ($CURRENT_SHA256)"
          if [[ "$CURRENT_PROJECT_VERSION" != "$VERSION" ]]; then
            echo "::error::Main project version $CURRENT_PROJECT_VERSION does not match release candidate $VERSION"
            exit 1
          fi
          if ! single_current_published_version \
            "$VERSION" "$CURRENT_VERSION" "$CURRENT_REPOSITORY_CASK_VERSION" \
            "$CURRENT_APPCAST_VERSION" "$CURRENT_STRUCTURED_VERSION" >/dev/null; then
            echo "::error::Mutable channels changed after preflight; refusing Homebrew mutation"
            exit 1
          fi
          if [[ "$CURRENT_SHA256" != "$CURRENT_REPOSITORY_CASK_SHA256" ]]; then
            echo "::error::Repository cask checksum no longer matches the public Homebrew tap"
            exit 1
          fi
          if build_greater_or_equal "$CURRENT_APPCAST_BUILD" "$BUILD_NUM"; then
            echo "::error::Appcast build $CURRENT_APPCAST_BUILD is newer than or equal to candidate $BUILD_NUM"
            exit 1
          fi
          if [[ "$CURRENT_VERSION" == "$VERSION" && "$CURRENT_SHA256" != "$SHA256" ]]; then
            echo "::error::Homebrew already publishes $VERSION with a different checksum; refusing replacement"
            exit 1
          fi
          sed -i '' -E "s/^([[:space:]]*)version \"[0-9]+\.[0-9]+\.[0-9]+\"[[:space:]]*$/\\1version \"$VERSION\"/" Casks/easelwall.rb
          sed -i '' -E "s/^([[:space:]]*)sha256 \"[0-9A-Fa-f]{64}\"[[:space:]]*$/\\1sha256 \"$SHA256\"/" Casks/easelwall.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/easelwall.rb
          if git diff --cached --quiet; then
            echo "Homebrew cask is already current"
            exit 0
          fi
          git commit -m "Update EaselWall to $VERSION"
          git push

      - name: Update appcast.xml
        working-directory: appcast-repo
        run: |
          if [ "$(git branch --show-current)" != "main" ]; then
            echo "Appcast checkout is not on main" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --no-rebase origin main
          . scripts/release_metadata_guards.sh
          if ! CURRENT_VERSION=$(single_appcast_value version website/appcast.xml); then
            echo "::error::Appcast must contain exactly one valid short version"
            exit 1
          fi
          if ! CURRENT_BUILD=$(single_appcast_value build website/appcast.xml); then
            echo "::error::Appcast must contain exactly one numeric sparkle build"
            exit 1
          fi
          echo "Current appcast: $CURRENT_VERSION (build $CURRENT_BUILD)"
          if ! CURRENT_PROJECT_VERSION=$(single_project_version project.yml); then
            echo "::error::project.yml must contain exactly one canonical MARKETING_VERSION"
            exit 1
          fi
          if ! CURRENT_STRUCTURED_VERSION=$(single_structured_version website/index.html); then
            echo "::error::Website structured data must contain exactly one canonical softwareVersion"
            exit 1
          fi
          if ! CURRENT_REPOSITORY_CASK_VERSION=$(single_cask_version Casks/easelwall.rb); then
            echo "::error::Repository cask must contain exactly one canonical version declaration"
            exit 1
          fi
          if ! CURRENT_REPOSITORY_CASK_SHA256=$(single_cask_sha256 Casks/easelwall.rb); then
            echo "::error::Repository cask must contain exactly one canonical sha256 declaration"
            exit 1
          fi
          if ! single_homepage_lastmod website/sitemap.xml >/dev/null; then
            echo "::error::Sitemap must contain exactly one canonical homepage lastmod"
            exit 1
          fi
          if [[ "$CURRENT_PROJECT_VERSION" != "$VERSION" ]]; then
            echo "::error::Main project version $CURRENT_PROJECT_VERSION does not match release candidate $VERSION"
            exit 1
          fi
          if ! CURRENT_PUBLISHED_VERSION=$(single_current_published_version \
            "$VERSION" "$CURRENT_VERSION" "$CURRENT_REPOSITORY_CASK_VERSION" \
            "$CURRENT_STRUCTURED_VERSION"); then
            echo "::error::Main appcast, repository cask, and website versions disagree or exceed candidate $VERSION"
            exit 1
          fi
          echo "Main recheck passed: candidate $CURRENT_PROJECT_VERSION; current channels publish $CURRENT_PUBLISHED_VERSION"
          if [[ "$CURRENT_REPOSITORY_CASK_VERSION" == "$VERSION" && \
                "$CURRENT_REPOSITORY_CASK_SHA256" != "$SHA256" ]]; then
            echo "::error::Repository cask already publishes $VERSION with a different checksum"
            exit 1
          fi
          cat > website/appcast.xml.next << APPCASTEOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>EaselWall</title>
              <link>https://easelwall.com/appcast.xml</link>
              <description>EaselWall update feed</description>
              <language>en</language>
              <item>
                <title>Version $VERSION</title>
                <sparkle:version>$BUILD_NUM</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <pubDate>$RELEASE_PUB_DATE</pubDate>
                <enclosure
                  url="https://github.com/ntindle/EaselWall/releases/download/v$VERSION/$APP_NAME-$VERSION.dmg"
                  type="application/octet-stream"
                  sparkle:edSignature="$ED_SIGNATURE"
                  length="$DMG_SIZE"
                />
              </item>
            </channel>
          </rss>
          APPCASTEOF
          # Remove leading whitespace from heredoc
          sed -i '' 's/^          //' website/appcast.xml.next
          if cmp -s website/appcast.xml website/appcast.xml.next; then
            rm -f website/appcast.xml.next
            echo "Appcast is already exactly current"
          else
            if build_greater_or_equal "$CURRENT_BUILD" "$BUILD_NUM"; then
              echo "::error::Appcast build $CURRENT_BUILD is newer than or equal to candidate $BUILD_NUM; refusing overwrite"
              exit 1
            fi
            mv website/appcast.xml.next website/appcast.xml
          fi
          python3 scripts/update_release_metadata.py \
            --version "$VERSION" \
            --date "$RELEASE_DATE"
          sed -i '' -E "s/^([[:space:]]*)version \"[0-9]+\.[0-9]+\.[0-9]+\"[[:space:]]*$/\\1version \"$VERSION\"/" Casks/easelwall.rb
          sed -i '' -E "s/^([[:space:]]*)sha256 \"[0-9A-Fa-f]{64}\"[[:space:]]*$/\\1sha256 \"$SHA256\"/" Casks/easelwall.rb

          if [[ "$(single_project_version project.yml)" != "$VERSION" || \
                "$(single_structured_version website/index.html)" != "$VERSION" || \
                "$(single_cask_version Casks/easelwall.rb)" != "$VERSION" || \
                "$(single_cask_sha256 Casks/easelwall.rb)" != "$SHA256" || \
                "$(single_appcast_value version website/appcast.xml)" != "$VERSION" || \
                "$(single_appcast_value build website/appcast.xml)" != "$BUILD_NUM" ]]; then
            echo "::error::Generated release metadata failed post-update validation"
            exit 1
          fi
          git add \
            Casks/easelwall.rb \
            project.yml \
            website/appcast.xml \
            website/index.html \
            website/sitemap.xml
          if git diff --cached --quiet; then
            echo "Release metadata is already exactly current"
            exit 0
          fi
          EXPECTED_RELEASE_METADATA_SHA=$(shasum -a 256 \
            Casks/easelwall.rb project.yml website/appcast.xml \
            website/index.html website/sitemap.xml \
            | shasum -a 256 | awk '{ print $1 }')
          git commit -m "Update release metadata for v$VERSION"
          for PUSH_ATTEMPT in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            if (( PUSH_ATTEMPT == 3 )); then
              echo "::error::Unable to push appcast after 3 merge-only attempts"
              exit 1
            fi
            echo "Main advanced; fetching and merging before push retry $((PUSH_ATTEMPT + 1))"
            git fetch origin main
            if ! git merge --no-edit origin/main; then
              echo "::error::Main changed incompatibly; refusing to resolve automatically"
              exit 1
            fi
            MERGED_RELEASE_METADATA_SHA=$(shasum -a 256 \
              Casks/easelwall.rb project.yml website/appcast.xml \
              website/index.html website/sitemap.xml \
              | shasum -a 256 | awk '{ print $1 }')
            if [[ "$MERGED_RELEASE_METADATA_SHA" != "$EXPECTED_RELEASE_METADATA_SHA" ]]; then
              echo "::error::Concurrent merge changed release metadata; refusing to publish"
              exit 1
            fi
          done

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"
