name: App Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (e.g. 1.0.0). If empty, uses the latest tag.
        required: false

# App Store uploads are an ordered, mutable publication stream. Keep runs
# serialized so a delayed older tag cannot upload after a newer release.
concurrency:
  group: easelwall-app-store-upload
  cancel-in-progress: false

env:
  APP_NAME: EaselWall
  SCHEME: EaselWall

jobs:
  archive-and-upload:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and retry-safe build number
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$REQUESTED_VERSION" ]]; then
            VERSION="${REQUESTED_VERSION#v}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | sed -n '1p')
            if [[ -z "$LATEST_TAG" ]]; then
              echo "::error::No version tag found; supply the version input"
              exit 1
            fi
            VERSION="${LATEST_TAG#v}"
          fi
          SEMVER_RE='^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'
          if [[ ! "$VERSION" =~ $SEMVER_RE ]]; then
            echo "::error::Marketing version must use canonical components from 0 to 999"
            exit 1
          fi
          CURRENT_EPOCH=$(date -u +%s)
          BUILD_RUN=$((CURRENT_EPOCH - 1735689600))
          if (( BUILD_RUN <= 837975 )); then
            echo "::error::Build run $BUILD_RUN must exceed shipped build 837975"
            exit 1
          fi
          BUILD_CHANNEL=2
          BUILD_ATTEMPT="${GITHUB_RUN_ATTEMPT:-1}"
          if [[ ! "$BUILD_CHANNEL" =~ ^(0|[1-9][0-9]*)$ || "$BUILD_CHANNEL" != 2 ]]; then
            echo "::error::App Store build channel must be numeric channel 2"
            exit 1
          fi
          if [[ ! "$BUILD_ATTEMPT" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::GITHUB_RUN_ATTEMPT must be canonical numeric"
            exit 1
          fi
          BUILD_NUM="$BUILD_RUN.$BUILD_CHANNEL.$BUILD_ATTEMPT"
          BUILD_RE='^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){0,2}$'
          if [[ ! "$BUILD_NUM" =~ $BUILD_RE || ${#BUILD_NUM} -gt 18 ]]; then
            echo "::error::CFBundleVersion must be 1-3 numeric components and at most 18 characters"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUM=$BUILD_NUM" >> "$GITHUB_ENV"
          echo "Version: $VERSION, build $BUILD_NUM"

      - name: Bind the build to its release tag
        run: |
          TAG="v$VERSION"
          git fetch --prune --prune-tags --tags origin
          if ! git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "::error::Release tag $TAG does not exist"
            exit 1
          fi
          git checkout --detach "refs/tags/$TAG"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-list -n 1 "$TAG")" ]]; then
            echo "::error::Checked-out source does not match $TAG"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate App Store Xcode project
        run: |
          scripts/prepare_appstore_project.py build/project-appstore.yml
          xcodegen generate --spec build/project-appstore.yml --project . --project-root .

      - name: Import Apple Distribution certificate
        env:
          P12_BASE64: ${{ secrets.APP_STORE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APP_STORE_P12_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          chmod 600 "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Install App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          umask 077
          install -d -m 700 "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      - name: Archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project EaselWall.xcodeproj \
            -scheme "$SCHEME" \
            -configuration AppStore \
            -destination 'generic/platform=macOS' \
            -archivePath "build/$APP_NAME.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            archive

      - name: Verify App Store archive has no Sparkle linkage
        run: |
          APP_PATH="build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::App not found in archive"
            ls -R "build/$APP_NAME.xcarchive/Products"
            exit 1
          fi
          if otool -L "$APP_PATH/Contents/MacOS/$APP_NAME" | grep -q Sparkle; then
            echo "::error::App Store binary still links Sparkle"
            otool -L "$APP_PATH/Contents/MacOS/$APP_NAME"
            exit 1
          fi
          if [ -d "$APP_PATH/Contents/Frameworks/Sparkle.framework" ]; then
            echo "::error::Sparkle is still embedded in the App Store archive"
            exit 1
          fi
          echo "App Store archive has no Sparkle linkage."

      - name: Export for App Store
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "build/$APP_NAME.xcarchive" \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}"
          ls -la build/export

      # Validate again immediately before the only irreversible external
      # mutation. This catches manual dispatches for old versions and tags that
      # became stale while the archive was building.
      - name: Verify tag is latest release before upload
        run: |
          git fetch --prune --prune-tags --tags origin
          TAG="v$VERSION"
          DIRECT_REF="refs/tags/$TAG"
          PEELED_REF="${DIRECT_REF}^{}"
          if ! REMOTE_TAG_REFS=$(git ls-remote --exit-code origin "$DIRECT_REF" "$PEELED_REF"); then
            echo "::error::Release tag $TAG no longer exists on origin"
            exit 1
          fi
          DIRECT_COUNT=$(printf '%s\n' "$REMOTE_TAG_REFS" | awk -v ref="$DIRECT_REF" '$2 == ref { count++ } END { print count + 0 }')
          PEELED_COUNT=$(printf '%s\n' "$REMOTE_TAG_REFS" | awk -v ref="$PEELED_REF" '$2 == ref { count++ } END { print count + 0 }')
          if (( DIRECT_COUNT != 1 || PEELED_COUNT > 1 )); then
            echo "::error::Remote tag $TAG did not resolve uniquely"
            exit 1
          fi
          if (( PEELED_COUNT == 1 )); then
            REMOTE_TAG_COMMIT=$(printf '%s\n' "$REMOTE_TAG_REFS" | awk -v ref="$PEELED_REF" '$2 == ref { print $1 }')
          else
            REMOTE_TAG_COMMIT=$(printf '%s\n' "$REMOTE_TAG_REFS" | awk -v ref="$DIRECT_REF" '$2 == ref { print $1 }')
          fi
          CHECKED_OUT_COMMIT=$(git rev-parse HEAD)
          LOCAL_TAG_COMMIT=$(git rev-parse "$DIRECT_REF^{commit}")
          if [[ "$REMOTE_TAG_COMMIT" != "$CHECKED_OUT_COMMIT" || "$LOCAL_TAG_COMMIT" != "$CHECKED_OUT_COMMIT" ]]; then
            echo "::error::Origin tag $TAG does not resolve to the checked-out commit"
            exit 1
          fi

          LATEST_TAG=""
          SEMVER_TAG_RE='^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'
          while IFS= read -r CANDIDATE; do
            if [[ "$CANDIDATE" =~ $SEMVER_TAG_RE ]]; then
              LATEST_TAG="$CANDIDATE"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)

          if [[ -z "$LATEST_TAG" ]]; then
            echo "::error::No semantic release tag exists"
            exit 1
          fi
          if [[ "$LATEST_TAG" != "$TAG" ]]; then
            echo "::error::Refusing to upload v$VERSION because $LATEST_TAG is newer"
            exit 1
          fi
          echo "v$VERSION is the latest release tag"

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          shopt -s nullglob
          PACKAGES=(build/export/*.pkg)
          if (( ${#PACKAGES[@]} != 1 )); then
            echo "::error::Expected exactly one .pkg from export; found ${#PACKAGES[@]}"
            ls -la build/export
            exit 1
          fi
          PKG_PATH="${PACKAGES[0]}"
          echo "Uploading $PKG_PATH"
          xcrun altool --upload-app \
            -f "$PKG_PATH" \
            --type macos \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"
          rm -f "$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"
          rmdir "$HOME/private_keys" 2>/dev/null || true
