name: App Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (e.g. 1.0.0). If empty, uses the latest tag.
        required: false

env:
  APP_NAME: EaselWall
  SCHEME: EaselWall

jobs:
  archive-and-upload:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import Apple Distribution certificate
        env:
          P12_BASE64: ${{ secrets.APP_STORE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APP_STORE_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Install App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Compute build number
        run: |
          # Monotonic build number from epoch seconds since Jan 2026; fits CFBundleVersion conventions
          BUILD_NUM=$(( ($(date +%s) - 1735689600) / 60 ))
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
          echo "Build number: $BUILD_NUM (from $(date -u))"

      - name: Archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project EaselWall.xcodeproj \
            -scheme $SCHEME \
            -configuration AppStore \
            -destination 'generic/platform=macOS' \
            -archivePath build/$APP_NAME.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }} \
            MARKETING_VERSION=$VERSION \
            CURRENT_PROJECT_VERSION=$BUILD_NUM \
            DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM \
            archive

      - name: Strip Sparkle from App Store archive
        run: |
          # Sparkle is gated by #if !APPSTORE so the binary has no symbol
          # references to it, but the framework is still embedded via SPM
          # and trips App Store validation (sandbox + signing rules for
          # the bundled XPC services). Remove it from the archived bundle.
          APP_PATH=$(find build/$APP_NAME.xcarchive/Products/Applications -name "$APP_NAME.app" -maxdepth 2 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::App not found in archive"
            ls -R build/$APP_NAME.xcarchive/Products
            exit 1
          fi
          SPARKLE="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPARKLE" ]; then
            echo "Removing $SPARKLE"
            rm -rf "$SPARKLE"
            # Re-sign the app since its frameworks contents changed
            codesign --force --options runtime --timestamp \
              --sign "Apple Distribution" \
              --entitlements EaselWall-AppStore.entitlements \
              "$APP_PATH" || \
              echo "(non-fatal: re-sign may not be needed if exportArchive re-signs)"
          else
            echo "Sparkle not embedded (good)."
          fi

      - name: Export for App Store
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/$APP_NAME.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ls -la build/export

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          PKG_PATH=$(find build/export -name "*.pkg" -maxdepth 1 | head -1)
          if [[ -z "$PKG_PATH" ]]; then
            echo "::error::No .pkg produced by export step"
            ls -la build/export
            exit 1
          fi
          echo "Uploading $PKG_PATH"
          xcrun altool --upload-app \
            -f "$PKG_PATH" \
            --type macos \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -rf ~/private_keys
