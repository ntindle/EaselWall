name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Remove ControlWidget dependency (requires macOS 26 SDK)
        run: |
          # Strip just the widget dependency line; leave the dependencies: block
          # and any other entries (e.g. Sparkle) intact.
          python3 -c "
          with open('project.yml') as f:
              content = f.read()
          content = content.replace('      - target: EaselWallControlWidget\n', '')
          with open('project.yml', 'w') as f:
              f.write(content)
          "
          xcodegen generate

      - name: Test unhosted logic (Debug)
        run: |
          xcodebuild -project EaselWall.xcodeproj \
            -scheme EaselWallTests \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build (Debug)
        run: |
          xcodebuild -project EaselWall.xcodeproj \
            -target EaselWall \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_ENTITLEMENTS="" \
            build
